name: Deploy api.tobias-hopp.de

on:
  push:
    branches: ["Prod"]
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/Prod' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci || (rm -f package-lock.json && npm install)

      - name: Build assets (Vite)
        run: npm run build

      - name: Write SSH key (raw PEM secret)
        env:
          KEY_B64: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          KEY="$HOME/.ssh/web_deploy_key"
          if [ -z "$KEY_PEM" ]; then
            echo "::error title=Missing secret::DEPLOY_SSH_PRIVATE_KEY_PEM is not set"
            exit 1
          fi
          # write exactly as provided, then normalize CRLF -> LF
          printf "%s" "$KEY_PEM" > "$KEY"
          sed -i 's/\r$//' "$KEY" || true
          chmod 600 "$KEY"
          # Non-secret diagnostics
          echo "pem_env_length=${#KEY_PEM}"
          echo "pem_file_bytes=$(wc -c < \"$KEY\")"
          echo "pem_file_lines=$(wc -l < \"$KEY\")"
          if head -1 "$KEY" | grep -qx '-----BEGIN OPENSSH PRIVATE KEY-----'; then echo "pem_header=ok"; else echo "pem_header=missing"; fi
          if tail -1 "$KEY" | grep -qx '-----END OPENSSH PRIVATE KEY-----'; then echo "pem_footer=ok"; else echo "pem_footer=missing"; fi
          if ! ssh-keygen -lf "$KEY" >/dev/null 2>&1; then
            echo "::error title=Invalid SSH key::Secret must contain an unencrypted OpenSSH private key (BEGIN/END)."
            exit 1
          fi

      - name: Add host key
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
          ssh-keyscan -p "$PORT" -t rsa,ed25519 -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

      - name: Probe SSH connectivity
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
          ssh -i "$HOME/.ssh/web_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -p "$PORT" "${{ secrets.DEPLOY_USER }}@$HOST" echo ok

      - name: Ensure remote directory exists
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
          ssh -i "$HOME/.ssh/web_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -p "$PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p \"${{ secrets.DEPLOY_PATH }}\""

      - name: Upload app (tar stream, exclude dev files)
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
          REMOTE="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          REMOTE_PATH="${{ secrets.DEPLOY_PATH }}"
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=tests \
            --exclude=storage \
            --exclude=.env \
            --exclude=x-files \
            -czf - . \
          | ssh -i "$HOME/.ssh/web_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -p "$PORT" "$REMOTE" "tar -xzf - -C \"$REMOTE_PATH\""

      - name: Run remote deploy (Composer + Artisan)
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -z "$PORT" ] && PORT=22
          ssh -i "$HOME/.ssh/web_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -p "$PORT" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -lc '
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            mkdir -p storage bootstrap/cache
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan key:generate --force || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            chmod -R ug+rwx storage bootstrap/cache || true
          '
