name: tests

on:
    push:
        branches:
            - prod

jobs:
    ci:
        runs-on: ubuntu-latest
        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: apitobiashoppde_test
            DB_USERNAME: root
            DB_PASSWORD: root

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: apitobiashoppde_test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=10s --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.4
                  tools: composer:v2
                  coverage: xdebug

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install Node Dependencies
              run: npm ci

            - name: Install Dependencies
              run:
                  composer install --no-interaction --prefer-dist
                  --optimize-autoloader

            - name: Build Assets
              run: npm run build

            - name: Copy Environment File
              run: cp .env.template .env

            - name: Generate Application Key
              run: php artisan key:generate

            - name: Tests
              run: php artisan test --compact
